<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Post — ANU TaskMate</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/" class="brand">ANU TaskMate</a>
        <ul class="nav-links">
          <li><a href="/" class="nav-link">Home</a></li>
          <li><a href="/#communities" class="nav-link">Explore</a></li>
          <li><a href="/create" class="nav-link nav-cta">Create Post</a></li>
          <li><a href="/my-activity" class="nav-link">My Activity</a></li>
                  <li class="notification-bell-item">
            <button type="button" id="notification-bell" class="notification-bell" aria-haspopup="true" aria-expanded="false" aria-label="Notifications">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 8a6 6 0 0 1 12 0c0 4.5 1.5 6 2 7H4c.5-1 2-2.5 2-7Z" />
                <path d="M10 19a2 2 0 0 0 4 0" />
              </svg>
              <span id="notification-count" class="notification-count" hidden>0</span>
            </button>
            <div id="notification-dropdown" class="notification-dropdown" hidden>
              <div class="notification-dropdown-header">
                <h3>Notifications</h3>
                <button type="button" id="notification-mark-all-read" class="notification-mark-all-read">Mark all as read</button>
              </div>
              <ul id="notification-list" class="notification-list"></ul>
              <p id="notification-empty" class="notification-empty" hidden>No notifications yet.</p>
            </div>
          </li>
        </ul>
      </nav>
    </header>

    <section class="community-hero">
      <a href="/#communities" class="back-link">← Back to all communities</a>
      <h1>Post an opportunity</h1>
      <p>Ask for a hand, offer one, or share something another student could use — pick a community below.</p>
    </section>

    <main>
      <section class="panel">
        <form id="post-form">
          <label>
            Your name
            <input type="text" name="authorName" maxlength="80" required />
          </label>

          <label>
            Category
            <select name="category" required>
              <option value="campus_help">Campus Help</option>
              <option value="study_together">Study Together</option>
              <option value="social_connect">Social Connect</option>
              <option value="campus_events">Campus Events</option>
            </select>
          </label>

          <label>
            Title
            <input type="text" name="title" maxlength="120" required />
          </label>

          <label>
            Description
            <textarea name="description" maxlength="2000" rows="3" required></textarea>
          </label>

          <fieldset class="paid-toggle">
            <legend>Is this paid?</legend>
            <label><input type="radio" name="isPaid" value="free" checked /> Free</label>
            <label><input type="radio" name="isPaid" value="paid" /> Paid</label>
            <label class="amount-field" hidden>
              Amount
              <input type="text" name="amount" maxlength="40" placeholder="e.g. $20" />
            </label>
          </fieldset>

          <button type="submit">Post</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="/create.js"></script>
    <script src="/notifications.js"></script>
  </body>
</html>
